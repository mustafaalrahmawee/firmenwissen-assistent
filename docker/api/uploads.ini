; Uploads of documents: the application allows 10 MB (config/documents.php).
; PHP accepts a little more, so a file just above 10 MB gets the message of the
; application. A larger request is turned away as a whole with 413.
upload_max_filesize = 12M
post_max_size = 12M
max_file_uploads = 1

; PHP warns about a request above post_max_size before Laravel runs. Printed into
; the response, the warning would send status 200 before Laravel can answer 413.
display_errors = Off
display_startup_errors = Off
